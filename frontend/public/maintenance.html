<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#242735" />
    <link rel="icon" href="/favicon.webp" />
    <title>Bombcrypto Market — Under Maintenance</title>
    <style>
      @font-face {
        font-family: 'Agency';
        src: url('/font/AGENCYR.TTF') format('truetype');
        font-display: swap;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #242735;
        color: #f4f4f4;
        font-family: 'Agency', 'Trebuchet MS', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        background:
          radial-gradient(ellipse at top, rgba(173, 255, 47, 0.08), transparent 55%),
          radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.55), transparent 60%),
          #242735;
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 12% 22%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 28% 78%, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(1.5px 1.5px at 55% 18%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1px 1px at 73% 65%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.5px 1.5px at 88% 30%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 42% 92%, rgba(255, 255, 255, 0.3), transparent);
        animation: twinkle 4s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }

      .logo {
        height: 72px;
        width: auto;
        margin-bottom: 36px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        z-index: 2;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(38px, 7vw, 68px);
        letter-spacing: 6px;
        color: #adff2f;
        text-shadow:
          0 2px 0 rgba(0, 0, 0, 0.5),
          0 0 24px rgba(173, 255, 47, 0.35);
        z-index: 2;
      }

      p.tagline {
        margin: 0 0 8px;
        font-size: clamp(18px, 2.4vw, 24px);
        letter-spacing: 2px;
        color: #e6e6e6;
        z-index: 2;
      }

      p.sub {
        margin: 0;
        font-size: clamp(14px, 1.6vw, 18px);
        letter-spacing: 1.5px;
        color: rgba(244, 244, 244, 0.6);
        z-index: 2;
      }

      .hero-deco {
        position: absolute;
        bottom: -10px;
        right: -20px;
        width: 240px;
        opacity: 0.18;
        pointer-events: none;
        transform: rotate(-6deg);
      }

      .hero-deco-left {
        position: absolute;
        bottom: -20px;
        left: -30px;
        width: 200px;
        opacity: 0.14;
        pointer-events: none;
        transform: rotate(8deg) scaleX(-1);
      }

      .footer {
        position: absolute;
        bottom: 16px;
        left: 0;
        right: 0;
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(244, 244, 244, 0.35);
        z-index: 2;
      }

      @media (max-width: 560px) {
        .hero-deco { width: 160px; right: -30px; }
        .hero-deco-left { width: 140px; left: -40px; }
        .logo { height: 56px; margin-bottom: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stars" aria-hidden="true"></div>

      <img
        class="hero-deco-left"
        src="/icons/bhero.webp"
        alt=""
        aria-hidden="true"
        onerror="this.style.display='none'"
      />
      <img
        class="hero-deco"
        src="/images/hero-demo.webp"
        alt=""
        aria-hidden="true"
        onerror="this.style.display='none'"
      />

      <img
        class="logo"
        src="/images/logo@3x.png"
        alt="Bombcrypto"
        onerror="this.src='/images/logo.png'"
      />

      <h1>UNDER MAINTENANCE</h1>
      <p class="tagline">We're polishing the marketplace</p>
      <p class="sub">Coming back soon. Thanks for your patience, bomber!</p>

      <div class="footer">&copy; Bombcrypto Marketplace</div>
    </div>
  </body>
</html>
