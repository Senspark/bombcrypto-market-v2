networks:
  base_default:
    external: true

name: bombcrypto
services:

  mk-bsc-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mk-bsc-api
    ports:
      - "8200:80"
    networks:
      - base_default
    environment:
      TZ: 'Asia/Bangkok'
      IS_PROD: false
      SERVER_PORT: 80
      SERVER_CACHE_EVICTION: 5
      SERVER_GET_CACHE_EVICTION: 60
      NETWORK: 'bsc'
      LOGGER_DEVELOPMENT: true
      LOGGER_LEVEL: info
      POSTGRES_CONN_STR: 'postgres://postgres:123456@postgres:5432/marketplace?search_path=bsc'
      REDIS_URL: 'redis://@redis:6379/0'
      BLOCKCHAIN_CENTER_API_URL: 'http://ap-blockchain-center'
      ENTRY_POINT: 'api'
      SERVER_ADMIN_API_KEY: ''
      SERVER_BHERO_CONTRACT_ADDRESS: '0xC1A4C06426B4Df799E455964A20FDe866E86fbd1'
      SERVER_BHOUSE_CONTRACT_ADDRESS: '0xB901EE87a6321ea73532C7fDF772dC9790b38c3C'

  mk-bsc-hero-subscriber:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mk-bsc-hero-subscriber
    ports:
      - "8201:80"
    networks:
      - base_default
    environment:
      TZ: 'Asia/Bangkok'
      IS_PROD: false
      SERVER_PORT: 80
      SERVER_CACHE_EVICTION: 5
      SERVER_GET_CACHE_EVICTION: 60
      NETWORK: 'bsc'
      LOGGER_DEVELOPMENT: true
      LOGGER_LEVEL: info
      POSTGRES_CONN_STR: 'postgres://postgres:123456@postgres:5432/marketplace?search_path=bsc'
      REDIS_URL: 'redis://@redis:6379/0'
      BLOCKCHAIN_CENTER_API_URL: 'http://ap-blockchain-center'
      ENTRY_POINT: 'hero'
      BCOIN_CONTRACT_ADDRESS: '0x648a9cf8e95c73110d28e7e2329b2d0910bd36b8'
      SEN_CONTRACT_ADDRESS: '0x4B5828F31550aFe15C61D7a765D9597ad4282325'
      SUBSCRIBER_BLOCK_RETRY_TIMEOUT: 10000
      SUBSCRIBER_HERO_CONTRACT_ADDRESS: '0x0A32cD1069cf6b4A11b79b37aFb2A13598E6E5ca'
      SUBSCRIBER_HERO_SOLD_NOTIFY_URL: 
      SUBSCRIBER_HERO_STARTING_BLOCK_NUMBER: 107529302

  mk-bsc-house-subscriber:
